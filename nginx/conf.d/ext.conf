# ext.sdop.example.internal — accès par lien, SANS mTLS
#
# Exception assumée à la doctrine « mTLS exigé sur tous les vhosts » (§3). Elle
# existe pour une raison précise : en réponse à incident, la victime qu'on aide
# n'a ni compte, ni certificat, et souvent plus de SI en état. Lui demander
# d'installer un P12 avant de lire le rapport qui doit l'aider reviendrait à ne
# pas l'aider.
#
# Le périmètre est donc borné, et ces bornes sont la contrepartie de l'exception :
#
#   1. TLP:RED n'est JAMAIS diffusable par lien — refus côté applicatif
#      (watermark/links.py), pas seulement ici.
#   2. Un lien seul ne suffit pas : second facteur obligatoire, TOTP enrôlé ou
#      code dicté de vive voix.
#   3. Ce vhost n'expose QUE le strict nécessaire à lire un document. Pas de
#      publication, pas de liste, pas de sonde d'identité, pas d'émission de
#      liens. Ce qui n'est pas listé ci-dessous renvoie 404.
#
# ⚠ L'identité d'un porteur de lien n'est PAS posée ici. Elle est résolue par
#    l'application à partir d'un cookie de session opaque qu'elle seule sait
#    traduire. La règle « l'identité ne vient jamais du client » tient : un
#    jeton n'est pas une identité déclarée, c'est une référence.

# ⚠ Les expressions régulières contenant un quantificateur `{n}` DOIVENT être
#    entre guillemets : sans cela nginx lit l'accolade comme une ouverture de
#    bloc et refuse de démarrer (`unknown directive "32}$"`). Piège invisible
#    à `docker compose config`.

server {
    listen 443 ssl;
    # HTTP/2 : une connexion par nom au lieu de six. Avec un certificat client
    # sur clé matérielle, chaque nouvelle connexion TLS est une signature
    # (PIN, toucher) ; une connexion à l'application déclenche une centaine
    # de requêtes.
    http2 on;
    server_name ext.sdop.example.internal;

    ssl_certificate     /etc/ssl/core/server/ext.crt;
    ssl_certificate_key /etc/ssl/core/server/ext.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/sdop-ext-locations.inc;
}
