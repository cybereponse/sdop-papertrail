# app.sdop.example.internal — Application SDOP
#
# Chaîne de sécurité :
#   1. mTLS      — cert client valide ou refus TLS (400)
#   2. FWD-AUTH  — auth_request vers l'outpost Authentik embedded
#   3. STRIP+INJECT — chaque en-tête de confiance est posé par le proxy :
#      soit la valeur vérifiée (outpost/mTLS/IP), soit "" explicite.
#      Le client ne peut JAMAIS fournir sa propre identité.
#
# Deux backends derrière cette même porte :
#   /            → service watermark (Lot 2, le produit : publication,
#                  visionneuse rasterisée, export filigrané)
#   /_identite   → placeholder (Lot 1) : renvoie les en-têtes reçus. Conservé
#                  parce qu'il est la SONDE de la chaîne — c'est lui qui rend
#                  observable le strip+inject (test de forgery, Palier 2 et
#                  critères d'acceptation du README). Il n'expose aucun
#                  document : il ne sait pas ce qu'est un document.
#
# ⚠️ Le bloc strip+inject vit dans sdop-trusted-headers.inc, inclus dans
#    CHAQUE location (voir l'en-tête de ce fichier pour la règle nginx).

server {
    listen 443 ssl;
    # HTTP/2 : une connexion par nom au lieu de six. Avec un certificat client
    # sur clé matérielle, chaque nouvelle connexion TLS est une signature
    # (PIN, toucher) ; une connexion à l'application déclenche une centaine
    # de requêtes.
    http2 on;
    # Connexions inactives gardées 30 min (défaut nginx : 75 s). Chaque nouvelle
    # connexion TLS = une signature sur clé matérielle (PIN, toucher) : sans
    # cela, chaque pause de lecture > 75 s redemanderait un toucher.
    keepalive_timeout 30m;
    server_name app.sdop.example.internal sdop.example.internal;

    # Nom court : porté en SAN par le certificat app,
    # redirigé ici vers le nom canonique. La redirection a lieu APRÈS la
    # poignée de main mTLS : sans certificat client valide, le nom court est
    # refusé comme le nom canonique. Le cookie d'Authentik est posé sur app.*,
    # d'où la redirection plutôt qu'un service sous deux noms.
    if ($host = "sdop.example.internal") {
        return 301 https://app.sdop.example.internal$request_uri;
    }

    # ── TLS serveur ──────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/core/server/app.crt;
    ssl_certificate_key /etc/ssl/core/server/app.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_APP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── mTLS : certificat client obligatoire (émis par CA interne) ───────
    ssl_client_certificate /etc/ssl/core/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    # Révocation. Le fichier est une CRL CONCATÉNÉE (intermédiaire + racine) :
    # nginx exige une CRL pour CHAQUE autorité de la chaîne présentée, sinon
    # il refuse tout certificat client avec « unable to get certificate CRL ».
    # Un seul des deux blocs PEM suffirait à casser le mTLS entier.
    #
    # ⚠️ nginx garde cette CRL EN MÉMOIRE, chargée au démarrage ou au reload :
    # révoquer un certificat sans recharger nginx ne révoque rien : il reste
    # accepté jusqu'au reload, puis refusé dès que les nouveaux workers
    # servent. Une requête lancée dans la même milliseconde que
    # `nginx -s reload` passe encore : qui mesure sans attendre conclut à tort
    # que la CRL ne marche pas. Révoquer = révoquer, régénérer la CRL,
    # recharger nginx ; la fréquence de régénération borne la validité
    # résiduelle d'un certificat révoqué hors urgence.
    #
    # Sans objet pour ext.conf : ce vhost n'a pas de ssl_verify_client, donc
    # aucun certificat client à révoquer.
    ssl_crl /etc/ssl/core/crl.pem;

    # ── Forward-auth via outpost Authentik embedded ───────────────────────
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @signin;

    # Récupération de l'identité vérifiée depuis la réponse de l'outpost
    auth_request_set $ak_username  $upstream_http_x_authentik_username;
    auth_request_set $ak_groups    $upstream_http_x_authentik_groups;
    auth_request_set $ak_email     $upstream_http_x_authentik_email;
    auth_request_set $ak_uid       $upstream_http_x_authentik_uid;

    # Dépôt de document : la limite applicative (SDOP_MAX_DOC_BYTES, 64 Mio par
    # défaut) doit pouvoir s'exprimer — sinon nginx refuse en 413 avant que
    # l'application n'ait rien à dire, et le refus n'est pas journalisé.
    client_max_body_size 64m;

    # ── Route outpost (subrequête auth + callback session) ────────────────
    location /outpost.goauthentik.io {
        # Cette route est CELLE QUI RÉPOND à auth_request. Sans ce `off`, la
        # sous-requête d'authentification déclencherait elle-même une
        # sous-requête d'authentification — récursion, ou pire, selon ce que
        # l'amont décide de faire. Les versions d'Authentik testées ne se
        # laissent pas prendre, mais la propriété dépendrait alors du logiciel
        # amont et non de cette configuration : l'expliciter la rend
        # autoportante.
        auth_request off;

        proxy_pass              http://authentik-server:9000/outpost.goauthentik.io;
        proxy_http_version      1.1;

        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Original-URL    $scheme://$http_host$request_uri;

        # Pas de corps pour la subrequête auth
        proxy_pass_request_body off;
        proxy_set_header        Content-Length    "";

        # Transmettre le Set-Cookie de l'outpost au navigateur client
        add_header              Set-Cookie        $upstream_http_set_cookie;
    }

    # ── Sonde d'identité (Lot 1) ─────────────────────────────────────────
    location /_identite {
        include /etc/nginx/conf.d/sdop-trusted-headers.inc;
        proxy_pass http://placeholder:8080/;
    }

    # ── Application SDOP ─────────────────────────────────────────────────
    location / {
        include /etc/nginx/conf.d/sdop-trusted-headers.inc;

        # La rasterisation est synchrone et CPU-bound : un export de document
        # volumineux dépasse largement les 60 s par défaut.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass http://watermark:5000;
    }

    # ── Redirection vers login si non authentifié ─────────────────────────
    # Mode forward_single : le /start DOIT être appelé sur l'hôte de l'app
    # (le callback de session revient sur ce même hôte).
    location @signin {
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
