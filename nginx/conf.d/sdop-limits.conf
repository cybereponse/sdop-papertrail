# Zones de limitation de débit du vhost d'accès par lien (SEC-011, volet public).
#
# Niveau `http` : nginx n'accepte `limit_req_zone` qu'ici, d'où un fichier
# `.conf` à part (conf.d/*.conf est inclus dans le bloc http du socle), et non
# dans sdop-ext-locations.inc, qui vit dans un bloc server. Il est installé
# avec les autres par `make install-vhost` ET par `make install-vhost-public` :
# sans lui, le vhost public référencerait des zones inexistantes et nginx
# refuserait de démarrer.
#
# Clé : l'adresse du client vue par nginx. Le vhost public n'a ni compte ni
# certificat avant le second facteur : l'adresse est la seule clé disponible.
# Les seuils sont LARGES à dessein — si les clients publics arrivaient tous
# derrière une même adresse (NAT de l'accès Internet), ces limites
# deviendraient globales ; elles doivent alors encore laisser passer un usage
# normal, et ne couper qu'une rafale. À resserrer une fois l'adresse réelle des
# clients vérifiée dans les journaux de production.

# Page de saisie du facteur et sa validation. Le verrouillage à 5 essais par
# lien reste la borne contre la force brute ; ceci borne le volume.
limit_req_zone $binary_remote_addr zone=sdop_ext_lien:10m    rate=30r/m;
# Visionneuse : une requête par ouverture ou rechargement.
limit_req_zone $binary_remote_addr zone=sdop_ext_pages:10m   rate=60r/m;
# Tuiles : une par page affichée, demandées toutes ensemble par le navigateur.
limit_req_zone $binary_remote_addr zone=sdop_ext_tuiles:10m  rate=30r/s;
# Export PDF : le travail le plus coûteux du service (document entier rendu).
limit_req_zone $binary_remote_addr zone=sdop_ext_export:10m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sdop_ext_conn:10m;
