# nginx.conf minimal pour Palier 2 — fournit UNIQUEMENT le prérequis de niveau
# http dont ../../../nginx/conf.d/app.conf a besoin ($ssl_client_s_dn_cn
# n'existe pas nativement dans nginx stock). Ce n'est PAS une copie de
# core/proxy/nginx/nginx.conf (qu'on ne recopie jamais ici, voir CLAUDE.md) —
# juste le motif nginx standard documenté publiquement pour extraire le CN
# d'un certificat client, recréé ici à l'identique de ce que core/ promet de
# fournir. app.conf lui-même n'est pas réécrit : copié tel quel dans ce
# contexte de build juste avant `docker compose build` (voir Makefile) —
# toujours synchronisé, jamais une version maintenue à part.
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        ~CN=(?<cn>[^,]+) $cn;
    }

    include /etc/nginx/conf.d/*.conf;
}
